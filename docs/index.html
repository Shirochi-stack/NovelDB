<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelDB — Browse & Filter Web Novels</title>
    <meta name="description" content="Search, filter, and browse web novels from Novelpia, KakaoPage, and SFACG by tags, views, likes, and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=12">
</head>

<body>
    <header>
        <div class="header-inner">
            <h1>📚 NovelDB</h1>
            <p class="subtitle">Browse & filter web novels across platforms</p>
        </div>
    </header>

    <main>
        <!-- Search & Controls -->
        <section class="controls">
            <div class="search-row">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search by title, author, or ID..."
                        autocomplete="off">
                </div>
                <div class="control-group">
                    <label>Source</label>
                    <select id="sourceSelect">
                        <option value="all" selected>All Sources</option>
                        <option value="novelpia">Novelpia</option>
                        <option value="kakao">KakaoPage</option>
                        <option value="sfacg">SFACG</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Sort by</label>
                    <select id="sortSelect">
                        <option value="daily">Daily Rank</option>
                        <option value="weekly">Weekly Rank</option>
                        <option value="monthly">Monthly Rank</option>
                        <option value="sfacg_popularity">SFACG: Popularity</option>
                        <option value="sfacg_bestseller">SFACG: Best Seller</option>
                        <option value="sfacg_newbooks">SFACG: New Books</option>
                        <option value="sfacg_bookmarks">SFACG: Bookmarks</option>
                        <option value="sfacg_jp">SFACG: JP Light Novels</option>
                        <option value="likes">Likes</option>
                        <option value="views">Views</option>
                        <option value="chapters">Chapters</option>
                        <option value="updated">Last Updated</option>
                        <option value="title">Title</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Order</label>
                    <select id="orderSelect">
                        <option value="desc">Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Per page</label>
                    <select id="batchSelect">
                        <option value="30">30</option>
                        <option value="60">60</option>
                        <option value="120">120</option>
                        <option value="250">250</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Status</label>
                    <select id="statusSelect">
                        <option value="all">All</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="complete">Complete</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Audience</label>
                    <select id="audienceSelect">
                        <option value="all">All</option>
                        <option value="general">General</option>
                        <option value="adult">Adult Only (19+)</option>
                        <option value="r15">Teen Only (R15+)</option>
                    </select>
                </div>
            </div>

            <!-- Tag Filters -->
            <div class="tag-section">
                <div class="tag-header" id="tagToggle" style="cursor:pointer">
                    <span>▶ Filter by tags</span>
                    <div class="tag-mode">
                        <button id="tagModeAnd" class="mode-btn active">AND</button>
                        <button id="tagModeOr" class="mode-btn">OR</button>
                    </div>
                    <button id="clearTags" class="clear-btn">Clear</button>
                </div>
                <div id="activeTagsSummary" class="active-tags-summary"></div>
                <input type="text" id="tagSearch" class="tag-search collapsed" placeholder="Search tags..." autocomplete="off">
                <div id="tagContainer" class="tag-grid collapsed"></div>
            </div>

            <!-- Exclude Tag Filters -->
            <div class="tag-section exclude-section">
                <div class="tag-header" id="excludeToggle" style="cursor:pointer">
                    <span>▶ Exclude tags</span>
                    <button id="clearExclude" class="clear-btn">Clear</button>
                </div>
                <div id="activeExcludeTagsSummary" class="active-tags-summary"></div>
                <input type="text" id="excludeTagSearch" class="tag-search collapsed" placeholder="Search tags..." autocomplete="off">
                <div id="excludeTagContainer" class="tag-grid collapsed"></div>
            </div>

            <div class="status-bar">
                <span id="resultCount">Loading...</span>
            </div>
        </section>

        <!-- Results -->
        <div id="paginationTop" class="pagination" style="display:none">
            <button class="page-btn prev-page">← Prev</button>
            <div class="page-numbers"></div>
            <div class="page-jump"><input type="number" class="page-input" min="1" placeholder="#"><button
                    class="page-btn go-page">Go</button></div>
            <button class="page-btn next-page">Next →</button>
        </div>
        <section id="results" class="results-grid"></section>

        <!-- Pagination -->
        <div id="paginationBottom" class="pagination" style="display:none">
            <button class="page-btn prev-page">← Prev</button>
            <div class="page-numbers"></div>
            <div class="page-jump"><input type="number" class="page-input" min="1" placeholder="#"><button
                    class="page-btn go-page">Go</button></div>
            <button class="page-btn next-page">Next →</button>
        </div>
    </main>

    <script src="app.js?v=43"></script>
</body>

</html>
