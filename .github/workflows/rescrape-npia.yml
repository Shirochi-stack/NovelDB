name: Update Npia Data

on:
  schedule:
    # Run every Sunday at 12:00 UTC (after rankings + translate chains finish)
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      author_sweep_id:
        description: 'Saved author sweep to continue (leave empty for a new full update)'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Rescrape Npia catalog and resolve missing R19 authors (no auth)
        env:
          AUTHOR_SWEEP_ID: ${{ inputs.author_sweep_id }}
        run: |
          CONTINUE_ARGS=()
          if [ -n "$AUTHOR_SWEEP_ID" ]; then
            CONTINUE_ARGS+=(--author-sweep-id "$AUTHOR_SWEEP_ID")
          fi
          python scripts/rescrape_npia_noauth.py --r19-listing-pages 0 --r19-detail-limit 0 --r19-delay 1 --author-page-size 100 --author-workers 4 --author-delay 1 --author-delay-max 2 --author-retries 4 --author-seconds 14400 --author-continuation-file .cache/npia-author-continuation.json --intro-requests 6 "${CONTINUE_ARGS[@]}"

      - name: Extract descriptions from full data
        run: python scripts/extract_descriptions.py

      - name: Gzip Npia descriptions
        run: python scripts/gzip_text_files.py docs/data/descriptions.txt

      - name: Chunk Npia descriptions
        run: python scripts/chunk_descriptions.py docs/data/descriptions.txt --prefix descriptions_shard --output-dir docs/data -n 128

      - name: Re-chunk Npia data (with embedded translations)
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix npia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt

      - name: Rebuild instant-load top rankings
        run: python scripts/build_npia_top.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/data/ && [ -z "$(git ls-files --others --exclude-standard -- docs/data/npia_public_state.json docs/data/npia_authors.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOVEL_COUNT=$(python -c "import json; print(len(json.load(open('docs/data/novels.json'))))")
          git add docs/data/novels.json docs/data/npia_public_state.json docs/data/npia_authors.json docs/data/descriptions.txt docs/data/descriptions.txt.gz docs/data/descriptions_shard_*.json.gz docs/data/descriptions_shard_manifest.json docs/data/npia_chunk_*.json.gz docs/data/npia_chunk_manifest.json docs/data/npia_top.json.gz
          python scripts/codename_policy.py sanitize-data
          python scripts/codename_policy.py check --commits
          git commit -m "🔄 Update Npia data: ${NOVEL_COUNT} novels ($(date -u +%Y-%m-%d))"
          git push

      - name: Continue unfinished R19 author checks
        uses: actions/github-script@v7
        env:
          AUTHOR_SWEEP_REF: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const sweep = JSON.parse(fs.readFileSync('.cache/npia-author-continuation.json', 'utf8'));
            await core.summary.addRaw(`Author sweep: ${sweep.completed.length}/${sweep.total} complete; ${sweep.remaining_catalogs ?? sweep.remaining} catalogs and ${sweep.remaining_identities ?? 0} author identities remaining.\n`).write();
            if (sweep.continuation_required) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'rescrape-npia.yml',
                ref: process.env.AUTHOR_SWEEP_REF,
                inputs: { author_sweep_id: sweep.id }
              });
              core.info('Saved author identities and completed pages; queued the next part of this R19 sweep.');
            } else if (!sweep.complete) {
              core.setFailed(`Incomplete coverage: ${sweep.remaining} author catalogs or identities still failed after three passes with request retries. Progress is saved for the next full sweep.`);
            }

      - name: Preserve author sweep recovery data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npia-author-sweep-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .cache/npia-author-continuation.json
            docs/data/npia_public_state.json
            docs/data/npia_authors.json
            docs/data/novels_full.json
