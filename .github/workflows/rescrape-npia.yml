name: Update Npia Data

on:
  schedule:
    # Run every Sunday at 12:00 UTC (after rankings + translate chains finish)
    - cron: '0 12 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Rescrape Novelpia catalog (no auth, preserves R19 data)
        run: python scripts/rescrape_npia_noauth.py

      - name: Extract descriptions from full data
        run: python scripts/extract_descriptions.py

      - name: Gzip Novelpia descriptions
        run: python scripts/gzip_text_files.py docs/data/descriptions.txt

      - name: Chunk Novelpia descriptions
        run: python scripts/chunk_descriptions.py docs/data/descriptions.txt --prefix descriptions_shard --output-dir docs/data -n 128

      - name: Re-chunk Novelpia data (with embedded translations)
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt

      - name: Rebuild instant-load top rankings
        run: python scripts/build_novelpia_top.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOVEL_COUNT=$(python -c "import json; print(len(json.load(open('docs/data/novels.json'))))")
          git add docs/data/novels.json docs/data/descriptions.txt docs/data/descriptions.txt.gz docs/data/descriptions_shard_*.json.gz docs/data/descriptions_shard_manifest.json docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json docs/data/novelpia_top.json.gz
          git commit -m "🔄 Update Npia data: ${NOVEL_COUNT} novels ($(date -u +%Y-%m-%d))"
          git push
