name: Update Npia Data

on:
  schedule:
    # Run every Sunday at 12:00 UTC (after rankings + translate chains finish)
    - cron: '0 12 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Rescrape Npia catalog and public R19 metadata (no auth)
        run: python scripts/rescrape_npia_noauth.py --r19-listing-pages 0 --r19-detail-limit 200 --r19-delay 2 --author-pages 200 --author-page-size 100 --author-delay 2 --intro-requests 6

      - name: Extract descriptions from full data
        run: python scripts/extract_descriptions.py

      - name: Gzip Npia descriptions
        run: python scripts/gzip_text_files.py docs/data/descriptions.txt

      - name: Chunk Npia descriptions
        run: python scripts/chunk_descriptions.py docs/data/descriptions.txt --prefix descriptions_shard --output-dir docs/data -n 128

      - name: Re-chunk Npia data (with embedded translations)
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix npia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt

      - name: Rebuild instant-load top rankings
        run: python scripts/build_npia_top.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/data/ && [ -z "$(git ls-files --others --exclude-standard -- docs/data/npia_public_state.json docs/data/npia_authors.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOVEL_COUNT=$(python -c "import json; print(len(json.load(open('docs/data/novels.json'))))")
          git add docs/data/novels.json docs/data/npia_public_state.json docs/data/npia_authors.json docs/data/descriptions.txt docs/data/descriptions.txt.gz docs/data/descriptions_shard_*.json.gz docs/data/descriptions_shard_manifest.json docs/data/npia_chunk_*.json.gz docs/data/npia_chunk_manifest.json docs/data/npia_top.json.gz
          python scripts/codename_policy.py sanitize-data
          python scripts/codename_policy.py check --commits
          git commit -m "🔄 Update Npia data: ${NOVEL_COUNT} novels ($(date -u +%Y-%m-%d))"
          git push
