name: Update Munpia Metadata
run-name: Munpia metadata — ${{ inputs.operation || (github.event.schedule == '0 17 * * *' && 'rankings') || 'catalog' }}
on:
  schedule:
    - cron: '0 8 * * 2'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: catalog
        options: [catalog, rankings, build, resume]
      workers:
        description: Concurrent catalog and detail workers (1–16; host pacing remains 0.5s)
        type: number
        default: 4
      auto_continue:
        description: Continue budget-limited catalog collection automatically
        type: boolean
        default: true
      recovery_run_id:
        description: Optional run ID to recover (blank checks failed runs automatically)
        type: string
      expected_scan:
        description: Internal continuation scan (leave blank for manual collection)
        type: string
      expected_revision:
        description: Internal continuation checkpoint (leave blank for manual collection)
        type: string
permissions:
  contents: write
  pages: write
  actions: read
jobs:
  update:
    uses: ./.github/workflows/metadata-source-job.yml
    with:
      source: munpia
      operation: ${{ github.event_name == 'schedule' && github.event.schedule == '0 17 * * *' && 'rankings' || inputs.operation || 'catalog' }}
      # Dispatch numbers can arrive as strings; workflow_call validates the actual type.
      workers: ${{ fromJSON(format('{0}', inputs.workers || 4)) }}
      auto_continue: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_continue }}
      recovery_run_id: ${{ inputs.recovery_run_id || '' }}
      expected_scan: ${{ inputs.expected_scan || '' }}
      expected_revision: ${{ inputs.expected_revision || '' }}
    secrets: inherit
