name: Translate SFACG

on:
  workflow_run:
    workflows: ["Update SFACG Data", "Update SFACG Rankings"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'grok-4-1-fast-reasoning'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (blank = auto route)'
        required: false
        default: ''
        type: string
      api_key:
        description: 'API key (blank = GROK_API_KEY secret)'
        required: false
        default: ''
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      output_token_limit:
        description: 'Output token limit'
        required: false
        default: '8192'
        type: string
      compression_factor:
        description: 'Compression factor'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  translate-sfacg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      - name: Mask pasted API key
        if: ${{ github.event.inputs.api_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.api_key }}"

      # --- Translate Titles ---
      - name: Sync SFACG titles from novels JSON
        run: python scripts/extract_titles.py sfacg

      - name: Extract untranslated SFACG titles
        run: python scripts/extract_untranslated_sfacg_titles.py

      - name: Translate SFACG titles
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || secrets.GROK_API_KEY }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || 'GROK_API_KEY' }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '8192' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/sfacg_titles_untranslated.txt --lang chinese --type titles --model ${{ github.event.inputs.model || 'grok-4-1-fast-reasoning' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated SFACG titles
        run: python scripts/merge_translated_sfacg_titles.py

      # --- Translate Descriptions ---
      - name: Reconcile SFACG descriptions
        run: python scripts/fetch_missing_sfacg_descriptions.py

      - name: Extract untranslated SFACG descriptions
        run: python scripts/extract_untranslated_sfacg_descriptions.py

      - name: Translate SFACG descriptions
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || secrets.GROK_API_KEY }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || 'GROK_API_KEY' }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '8192' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/sfacg_descriptions_untranslated.txt --lang chinese --type descriptions --model ${{ github.event.inputs.model || 'grok-4-1-fast-reasoning' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated SFACG descriptions
        run: python scripts/merge_translated_sfacg_descriptions.py

      - name: Gzip SFACG descriptions
        run: gzip -kf docs/data/sfacg_descriptions.txt

      # --- Re-chunk and build top ---
      - name: Re-chunk SFACG data (with embedded translations + descriptions)
        run: python scripts/chunk_and_compress.py --input docs/data/sfacg_novels.json --prefix sfacg_chunk --output-dir docs/data -n 10 --translations docs/data/sfacg_titles_en.txt --descriptions docs/data/sfacg_descriptions.txt

      - name: Build SFACG top file
        run: python scripts/build_sfacg_top.py

      # --- Commit ---
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/sfacg_titles_en.txt docs/data/sfacg_titles_untranslated.txt docs/data/sfacg_descriptions.txt.gz docs/data/sfacg_descriptions_untranslated.txt docs/data/sfacg_chunk_*.json.gz docs/data/sfacg_chunk_manifest.json docs/data/sfacg_top.json.gz
          git commit -m "🌐 Translate SFACG titles + descriptions ($(date -u +%Y-%m-%d))"
          git push
