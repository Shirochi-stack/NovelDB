name: Translate Novelpia Titles & Descriptions

on:
  workflow_run:
    workflows: ["Update Novelpia Rankings"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'grok-4.20-0309-non-reasoning'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (blank = auto route)'
        required: false
        default: ''
        type: string
      api_key:
        description: 'API key (blank = GROK_API_KEY secret)'
        required: false
        default: ''
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      output_token_limit:
        description: 'Output token limit'
        required: false
        default: '8192'
        type: string
      compression_factor:
        description: 'Compression factor'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  translate-novelpia-top:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      - name: Mask pasted API key
        if: ${{ github.event.inputs.api_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.api_key }}"

      # --- Titles ---
      - name: Rebuild titles_en.txt from novels.json (adds new novels)
        run: python scripts/extract_titles.py novelpia

      - name: Extract untranslated Novelpia titles
        run: python scripts/extract_untranslated_npia_titles.py

      - name: Translate Novelpia titles
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || secrets.GROK_API_KEY }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || 'GROK_API_KEY' }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '8192' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/titles_untranslated.txt --lang korean --type titles --model ${{ github.event.inputs.model || 'grok-4.20-0309-non-reasoning' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Novelpia titles
        run: python scripts/merge_translated_npia_titles.py

      # --- Descriptions ---
      - name: Extract untranslated Novelpia descriptions
        run: python scripts/extract_untranslated_npia_descriptions.py

      - name: Translate Novelpia descriptions
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || secrets.GROK_API_KEY }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || 'GROK_API_KEY' }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '8192' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/descriptions_untranslated.txt --lang korean --type descriptions --model ${{ github.event.inputs.model || 'grok-4.20-0309-non-reasoning' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Novelpia descriptions
        run: python scripts/merge_translated_npia_descriptions.py

      # --- Rebuild top JSON ---
      - name: Rebuild instant-load top rankings
        run: python scripts/build_novelpia_top.py

      # --- Re-chunk Novelpia data (with embedded translations + descriptions) ---
      - name: Re-chunk Novelpia data
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt --descriptions docs/data/descriptions.txt

      # --- Commit ---
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/titles_en.txt docs/data/descriptions.txt docs/data/novelpia_top.json.gz docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json
          git commit -m "🌐 Translate Npia titles & descriptions ($(date -u +%Y-%m-%d))"
          git push
