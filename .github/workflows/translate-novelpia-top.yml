name: Translate Novelpia Top 100

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Grok model to use'
        required: false
        default: 'grok-4-1-fast-reasoning'
        type: string

permissions:
  contents: write

concurrency:
  group: novelpia-data
  cancel-in-progress: false

jobs:
  translate-novelpia-top:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      # --- Titles ---
      - name: Extract untranslated Novelpia titles
        run: python scripts/extract_untranslated_npia_titles.py

      - name: Translate Novelpia titles with Grok
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/translate_with_grok.py docs/data/titles_untranslated.txt --lang korean --type titles --model ${{ github.event.inputs.model }}

      - name: Merge translated Novelpia titles
        run: python scripts/merge_translated_npia_titles.py

      # --- Descriptions ---
      - name: Extract untranslated Novelpia descriptions
        run: python scripts/extract_untranslated_npia_descriptions.py

      - name: Translate Novelpia descriptions with Grok
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/translate_with_grok.py docs/data/descriptions_untranslated.txt --lang korean --type descriptions --model ${{ github.event.inputs.model }}

      - name: Merge translated Novelpia descriptions
        run: python scripts/merge_translated_npia_descriptions.py

      # --- Rebuild top JSON ---
      - name: Rebuild instant-load top rankings
        run: python scripts/build_novelpia_top.py

      # --- Re-chunk Novelpia data (with embedded translations + descriptions) ---
      - name: Re-chunk Novelpia data
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt --descriptions docs/data/descriptions.txt

      # --- Commit ---
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/titles_en.txt docs/data/descriptions.txt docs/data/novelpia_top.json.gz docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json
          git commit -m "🌐 Translate Novelpia top titles & descriptions ($(date -u +%Y-%m-%d))"
          git push
