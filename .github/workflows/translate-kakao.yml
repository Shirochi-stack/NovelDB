name: Translate Kakao

on:
  workflow_run:
    workflows: ["Update Kakao Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'gpt-6-luna'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (blank = auto route)'
        required: false
        default: ''
        type: string
      api_key:
        description: 'API key (blank = OPENAI_API_KEY secret; provider overrides supported)'
        required: false
        default: ''
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      output_token_limit:
        description: 'Max output tokens per request (positive integer; blank = repository variable or 16384)'
        required: false
        default: '16384'
        type: string
      compression_factor:
        description: 'Compression factor'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  translate-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Migrate legacy descriptions to gzip
        run: python scripts/kakao_descriptions.py

      - name: Install dependencies
        run: pip install requests tiktoken

      - name: Mask pasted API key
        if: ${{ github.event.inputs.api_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.api_key }}"

      # --- Translate Titles ---
      - name: Sync Kakao titles from novels JSON
        run: python scripts/extract_titles.py kakao

      - name: Extract untranslated Kakao titles
        run: python scripts/extract_untranslated_kakao_titles.py

      - name: Translate Kakao titles
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || '' }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || vars.TRANSLATION_OUTPUT_TOKEN_LIMIT || '16384' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/kakao_titles_untranslated.txt --lang korean --type titles --model ${{ github.event.inputs.model || 'gpt-6-luna' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Kakao titles
        run: python scripts/merge_translated_kakao_titles.py

      # --- Translate Descriptions ---
      - name: Reconcile Kakao descriptions
        run: python scripts/extract_kakao_descriptions.py

      - name: Extract untranslated Kakao descriptions
        run: python scripts/extract_untranslated_kakao_descriptions.py

      - name: Translate Kakao descriptions
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || '' }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || vars.TRANSLATION_OUTPUT_TOKEN_LIMIT || '16384' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/kakao_descriptions_untranslated.txt --lang korean --type descriptions --model ${{ github.event.inputs.model || 'gpt-6-luna' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Kakao descriptions
        run: python scripts/merge_translated_kakao_descriptions.py

      - name: Chunk Kakao descriptions
        run: python scripts/chunk_descriptions.py docs/data/kakao_descriptions.txt.gz --prefix kakao_descriptions_shard --output-dir docs/data -n 128

      # --- Re-chunk Kakao data ---
      - name: Re-chunk Kakao data with embedded translations
        run: python scripts/chunk_and_compress.py --input docs/data/kakao_novels.json --prefix kakao_chunk --output-dir docs/data -n 3 --translations docs/data/kakao_titles_en.txt

      # --- Commit ---
      - name: Snapshot recovery inputs
        if: always()
        run: python scripts/metadata_recovery.py snapshot --source kakao

      - name: Back up before publication
        id: backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-kakao-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'docs/data/kakao_*'
          python scripts/publish_metadata.py --message "Update kakao data"
      - name: Report durability
        if: always()
        run: |
          echo "Recovery backup: ${{ steps.backup.outcome }}; publication: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
