name: Translate Kakao

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'grok-4-1-fast-reasoning'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (DeepSeek: https://api.deepseek.com)'
        required: false
        default: 'https://api.x.ai/v1'
        type: string
      api_key_secret:
        description: 'GitHub secret name containing the API key'
        required: false
        default: 'GROK_API_KEY'
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      output_token_limit:
        description: 'Output token limit'
        required: false
        default: '384000'
        type: string
      compression_factor:
        description: 'Compression factor'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: write

concurrency:
  group: kakao-data
  cancel-in-progress: false

jobs:
  translate-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      # --- Translate Titles ---
      - name: Sync Kakao titles from novels JSON
        run: python scripts/extract_titles.py kakao

      - name: Extract untranslated Kakao titles
        run: python scripts/extract_untranslated_kakao_titles.py

      - name: Translate Kakao titles
        env:
          TRANSLATION_API_KEY: ${{ secrets[github.event.inputs.api_key_secret || 'GROK_API_KEY'] }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '384000' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/kakao_titles_untranslated.txt --lang korean --type titles --model ${{ github.event.inputs.model || 'grok-4-1-fast-reasoning' }} --api-base-url ${{ github.event.inputs.api_base_url || 'https://api.x.ai/v1' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Kakao titles
        run: python scripts/merge_translated_kakao_titles.py

      # --- Translate Descriptions ---
      - name: Reconcile Kakao descriptions
        run: python scripts/extract_kakao_descriptions.py

      - name: Extract untranslated Kakao descriptions
        run: python scripts/extract_untranslated_kakao_descriptions.py

      - name: Translate Kakao descriptions
        env:
          TRANSLATION_API_KEY: ${{ secrets[github.event.inputs.api_key_secret || 'GROK_API_KEY'] }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || '384000' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/kakao_descriptions_untranslated.txt --lang korean --type descriptions --model ${{ github.event.inputs.model || 'grok-4-1-fast-reasoning' }} --api-base-url ${{ github.event.inputs.api_base_url || 'https://api.x.ai/v1' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated Kakao descriptions
        run: python scripts/merge_translated_kakao_descriptions.py

      - name: Gzip Kakao descriptions
        run: gzip -kf docs/data/kakao_descriptions.txt

      # --- Re-chunk Kakao data ---
      - name: Re-chunk Kakao data with embedded translations and descriptions
        run: python scripts/chunk_and_compress.py --input docs/data/kakao_novels.json --prefix kakao_chunk --output-dir docs/data -n 3 --translations docs/data/kakao_titles_en.txt --descriptions docs/data/kakao_descriptions.txt

      # --- Commit ---
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/kakao_titles_en.txt docs/data/kakao_descriptions.txt.gz docs/data/kakao_chunk_*.json.gz docs/data/kakao_chunk_manifest.json
          git commit -m "Translate Kakao titles and descriptions ($(date -u +%Y-%m-%d))"
          git push
