name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.spec'
      - 'requirements.txt'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Install Homebrew dependencies (WeasyPrint / Pango)
        run: |
          brew install pango gobject-introspection cairo gdk-pixbuf libffi harfbuzz fontconfig freetype librsvg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller playwright greenlet pyee

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Strip Chromium code signatures (PyInstaller compat)
        run: |
          # PyInstaller tries to ad-hoc codesign every bundled binary, but
          # Playwright's Chromium ships with Google's existing signature.
          # Nested framework bundles inside the .app cause "bundle format
          # unrecognized" errors.  We must:
          #   1. Delete all _CodeSignature directories
          #   2. Strip signatures from every Mach-O binary
          PW_CACHE="$HOME/Library/Caches/ms-playwright"
          if [ -d "$PW_CACHE" ]; then
            # Remove all code signature directories first
            find "$PW_CACHE" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
            find "$PW_CACHE" -type f -name "*.signature" -delete 2>/dev/null || true

            # Strip signatures from every Mach-O binary (executables, dylibs,
            # framework binaries).  We use `file` to detect Mach-O files
            # rather than relying on permissions or extensions.
            find "$PW_CACHE" -type f | while read f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --remove-signature "$f" 2>/dev/null || true
              fi
            done
            echo "Stripped all code signatures from Chromium."
          fi

      - name: Convert icon.ico to icon.icns
        run: |
          mkdir -p icon.iconset
          sips -s format png icon.ico --out icon_base.png 2>/dev/null || true
          if [ -f icon_base.png ]; then
            for size in 16 32 64 128 256 512; do
              sips -z $size $size icon_base.png --out "icon.iconset/icon_${size}x${size}.png" 2>/dev/null || true
            done
            for size in 32 64 256 512 1024; do
              half=$((size / 2))
              sips -z $size $size icon_base.png --out "icon.iconset/icon_${half}x${half}@2x.png" 2>/dev/null || true
            done
            iconutil -c icns icon.iconset -o icon.icns
          fi

      - name: Build ND42 (Full + Playwright)
        id: build_full
        continue-on-error: true
        run: |
          pyinstaller NovelpiaDownloader_mac.spec --clean

      - name: Build ND42_Lite (No Playwright)
        run: |
          pyinstaller NovelpiaDownloader_mac_lite.spec --clean

      # If the full build failed (e.g. arm64 install_name_tool issue),
      # copy the lite build as the full build so we still get a DMG.
      - name: Fallback — promote Lite to Full if Full failed
        if: steps.build_full.outcome == 'failure'
        run: |
          echo "::warning::Full build failed, falling back to Lite for the Full DMG."
          cp -R dist/ND42_Lite.app dist/ND42.app 2>/dev/null || true

      - name: Create DMG (Full)
        if: steps.build_full.outcome == 'success' || hashFiles('dist/ND42.app') != ''
        run: |
          if [ -d "dist/ND42.app" ]; then
            mkdir -p dmg_contents
            cp -R dist/ND42.app dmg_contents/
            ln -s /Applications dmg_contents/Applications
            hdiutil create -volname "ND42" \
              -srcfolder dmg_contents \
              -ov -format UDZO \
              "ND42-macos-${{ matrix.arch }}.dmg"
          else
            echo "::warning::ND42.app not found, skipping Full DMG."
          fi

      - name: Create DMG (Lite)
        run: |
          mkdir -p dmg_lite_contents
          cp -R dist/ND42_Lite.app dmg_lite_contents/
          ln -s /Applications dmg_lite_contents/Applications
          hdiutil create -volname "ND42_Lite" \
            -srcfolder dmg_lite_contents \
            -ov -format UDZO \
            "ND42_Lite-macos-${{ matrix.arch }}.dmg"

      - name: Upload Full artifact
        uses: actions/upload-artifact@v4
        with:
          name: ND42-macos-${{ matrix.arch }}
          path: ND42-macos-${{ matrix.arch }}.dmg
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: ND42_Lite-macos-${{ matrix.arch }}
          path: ND42_Lite-macos-${{ matrix.arch }}.dmg
          retention-days: 90

  # Attach the freshly-built DMGs to an EXISTING GitHub Release tagged v42.
  # This job never creates a release — you must publish v42 once manually.
  # Subsequent workflow runs simply overwrite the attached DMGs so the
  # release's download URLs always point at the latest build.
  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ND42*-macos-*
          path: dmgs
          merge-multiple: true

      - name: Show collected assets
        run: ls -la dmgs

      - name: Verify v42 release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v42 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release 'v42' does not exist. Create it manually, then re-run."
            exit 1
          fi
          echo "Release v42 found; proceeding to upload assets."

      - name: Upload DMGs to v42 release (overwrite existing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber replaces existing assets with the same name instead of
          # failing, so re-runs always end up with the latest binary.
          gh release upload v42 dmgs/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
