name: Android App

on:
  push:
    branches: ['android/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to this existing release tag (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK with ANDROID_HOME set; AGP installs missing platforms.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Decode release key
        env:
          KEYSTORE_B64: ${{ secrets.NPIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "NPIA_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "No release key secret; the release APK is signed with the debug key."
          fi
      - name: Build release APK
        env:
          NPIA_KEYSTORE_PASSWORD: ${{ secrets.NPIA_KEYSTORE_PASSWORD }}
          NPIA_KEY_ALIAS: ${{ secrets.NPIA_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename and verify APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NpiaMobile-debug.apk
          cp app/build/outputs/apk/release/app-release.apk NpiaMobile-universal.apk
          rm -f "$RUNNER_TEMP/release.p12"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs NpiaMobile-universal.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          ls -lh NpiaMobile-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NpiaMobile-debug-apk
          path: android/NpiaMobile-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: NpiaMobile-universal-apk
          path: android/NpiaMobile-universal.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          retention-days: 7
      - name: Attach to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" NpiaMobile-universal.apk --clobber --repo "${{ github.repository }}"
