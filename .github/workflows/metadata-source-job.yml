name: Metadata source reusable job

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      operation:
        required: true
        type: string

      workers:
        type: number
        default: 4
      auto_continue:
        type: boolean
        default: true
      recovery_run_id:
        type: string
        default: ''
      expected_scan:
        type: string
        default: ''
      expected_revision:
        type: string
        default: ''
      model:
        type: string
        default: gpt-5.6-luna
      output_token_limit:
        description: 'Max output tokens per translation request (blank = repository variable or 16384)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  actions: read

# The caller must not claim the same lock while awaiting this reusable job.
concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      METADATA_WORKERS: ${{ inputs.workers }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      EXPECTED_SCAN: ${{ inputs.expected_scan }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      MODEL: ${{ inputs.model }}
      TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ inputs.output_token_limit || vars.TRANSLATION_OUTPUT_TOKEN_LIMIT || '16384' }}
      METADATA_SOURCE: ${{ inputs.source }}
      METADATA_OPERATION: ${{ inputs.operation }}
      TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata dependencies
        run: python -m pip install requests beautifulsoup4 tiktoken "curl_cffi>=0.14.0,<0.15"
      - name: Restore unpublished source progress
        if: inputs.operation != 'rankings'
        run: python scripts/metadata_recovery.py restore --source "$METADATA_SOURCE"
      - name: Check continuation checkpoint
        id: guard
        run: python scripts/metadata_workflow.py guard --source "$METADATA_SOURCE" --output-dir ".cache/metadata-build/$METADATA_SOURCE"
      - name: Collect or rebuild source metadata
        if: steps.guard.outputs.allowed == 'true'
        timeout-minutes: 330
        shell: bash
        run: |
          set -euo pipefail
          case "$METADATA_SOURCE" in naver|joara|munpia|ridi|naverseries) ;; *) exit 2 ;; esac
          case "$METADATA_OPERATION" in catalog|rankings|resume|build|translate) ;; *) exit 2 ;; esac
          stage=".cache/metadata-build/$METADATA_SOURCE"
          state="metadata/state"
          if [ "$METADATA_OPERATION" = translate ]; then
            python scripts/metadata_pipeline.py prepare --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
            python scripts/metadata_pipeline.py translate --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
            python scripts/metadata_pipeline.py merge --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
            python scripts/metadata_pipeline.py build --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
          elif [ "$METADATA_OPERATION" = build ]; then
            python scripts/metadata_pipeline.py prepare --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
            python scripts/metadata_pipeline.py build --source "$METADATA_SOURCE" --output-dir "$stage" --state-dir "$state"
          elif [ "$METADATA_OPERATION" = resume ] || [ "$METADATA_OPERATION" = catalog ]; then
            python scripts/metadata_pipeline.py run --source "$METADATA_SOURCE" --mode catalog --resume --output-dir "$stage" --state-dir "$state" --max-runtime 18000 --workers "$METADATA_WORKERS"
          else
            python scripts/metadata_pipeline.py run --source "$METADATA_SOURCE" --mode "$METADATA_OPERATION" --output-dir "$stage" --state-dir "$state" --max-runtime 18000 --workers "$METADATA_WORKERS"
          fi
      - name: Validate and promote source artifacts
        if: steps.guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage=".cache/metadata-build/$METADATA_SOURCE"
          if [ "$METADATA_OPERATION" = translate ]; then
            python scripts/metadata_pipeline.py promote --source "$METADATA_SOURCE" --output-dir "$stage" --target-dir docs/data --allow-partial --include-tags
          else
            python scripts/metadata_pipeline.py promote --source "$METADATA_SOURCE" --output-dir "$stage" --target-dir docs/data --allow-partial
          fi
      - name: Snapshot source recovery inputs
        if: always() && steps.guard.outputs.allowed == 'true'
        run: python scripts/metadata_recovery.py snapshot --source "$METADATA_SOURCE"
      - name: Back up source before publication
        id: backup
        if: always() && steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Commit original metadata or translated metadata independently
        id: publish
        if: success() && steps.guard.outputs.allowed == 'true' && steps.backup.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "metadata/state/$METADATA_SOURCE.json.gz" "docs/data/${METADATA_SOURCE}_*"
          if [ "$METADATA_OPERATION" = translate ]; then
            git add -- docs/data/tags_en.txt docs/data/tags_en.txt.gz
            if [ -f docs/data/tags_extra.json.gz ]; then
              git add -- docs/data/tags_extra.json.gz
            fi
          fi
          python scripts/publish_metadata.py --message "Update $METADATA_SOURCE metadata ($METADATA_OPERATION)"
      # Bot pushes do not start a branch-based Pages build. Request one explicitly
      # after the successful push, including on no-change reruns after a build failure.
      - name: Request GitHub Pages build
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (site.build_type !== 'legacy' || site.source?.path !== '/docs') {
              core.setFailed('Expected branch-based GitHub Pages publishing from /docs; no build requested.');
              return;
            }
            if (context.ref !== `refs/heads/${site.source.branch}`) {
              core.setFailed(`Run this workflow on the Pages publishing branch (${site.source.branch}); no build requested.`);
              return;
            }
            const { data: build } = await github.request('POST /repos/{owner}/{repo}/pages/builds', context.repo);
            core.info(`GitHub Pages build requested for ${site.source.branch}${site.source.path}: ${build.status}`);
            core.setOutput('status', build.status);
      - name: Report durability
        if: always()
        run: |
          echo "Recovery backup: ${{ steps.backup.outcome }}; publication: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize collection and continuation
        if: always()
        env:
          METADATA_SUCCESS: ${{ job.status == 'success' && steps.guard.outputs.allowed == 'true' }}
        run: python scripts/metadata_workflow.py summary --source "$METADATA_SOURCE" --output-dir ".cache/metadata-build/$METADATA_SOURCE"
      - name: Upload continuation decision
        if: always() && inputs.operation != 'translate'
        uses: actions/upload-artifact@v4
        with:
          name: metadata-continuation-${{ github.run_id }}
          path: .cache/metadata-build/${{ inputs.source }}/continuation.json
          include-hidden-files: true
          retention-days: 30
      - name: Preserve source progress and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ inputs.source }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          include-hidden-files: true
          path: |
            metadata/state/${{ inputs.source }}.json.gz
            .cache/metadata-build/${{ inputs.source }}/${{ inputs.source }}_run_report.json
            .cache/metadata-build/${{ inputs.source }}/${{ inputs.source }}_*untranslated.txt
