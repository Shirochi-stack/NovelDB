name: Update Joara Metadata
run-name: Joara metadata — ${{ inputs.operation || (github.event.schedule == '0 18 * * *' && 'rankings') || 'catalog' }}
on:
  schedule:
    - cron: '0 8 * * 3'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: catalog
        options: [catalog, rankings, build, resume]
      workers:
        description: Concurrent detail workers (1–16; host pacing remains 0.5s)
        type: number
        default: 4
      auto_continue:
        description: Continue budget-limited catalog collection automatically
        type: boolean
        default: true
      expected_scan:
        description: Internal continuation scan (leave blank for manual collection)
        type: string
      expected_revision:
        description: Internal continuation checkpoint (leave blank for manual collection)
        type: string
permissions:
  contents: write
  pages: write
jobs:
  update:
    uses: ./.github/workflows/metadata-source-job.yml
    with:
      source: joara
      operation: ${{ github.event_name == 'schedule' && github.event.schedule == '0 18 * * *' && 'rankings' || inputs.operation || 'catalog' }}
      workers: ${{ inputs.workers || 4 }}
      auto_continue: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_continue }}
      expected_scan: ${{ inputs.expected_scan || '' }}
      expected_revision: ${{ inputs.expected_revision || '' }}
    secrets: inherit
