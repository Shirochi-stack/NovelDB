name: Backfill Npia Publication Dates

on:
  workflow_dispatch:
    inputs:
      author_limit:
        description: 'Maximum author catalogs to check for missing live R19 dates'
        type: number
        default: 0
      skip_search:
        description: 'Skip search and use author catalogs only'
        type: boolean
        default: false
      workers:
        description: 'Concurrent metadata workers'
        type: number
        default: 4

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Collect source-declared publication dates
        env:
          NPIA_METADATA_EMAIL: ${{ secrets.NPIA_METADATA_EMAIL }}
          NPIA_METADATA_PASSWORD: ${{ secrets.NPIA_METADATA_PASSWORD }}
          AUTHOR_LIMIT: ${{ inputs.author_limit }}
          SKIP_SEARCH: ${{ inputs.skip_search }}
          METADATA_WORKERS: ${{ inputs.workers }}
        run: |
          EXTRA_ARGS=()
          if [ "$SKIP_SEARCH" = "true" ]; then EXTRA_ARGS+=(--skip-search); fi
          python scripts/backfill_npia_publication_dates.py --checkpoint .cache/npia-publication-dates.json --workers "$METADATA_WORKERS" --author-limit "$AUTHOR_LIMIT" --adult-authors "${EXTRA_ARGS[@]}"
      - name: Preserve collected dates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npia-publication-dates
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: .cache/npia-publication-dates.json
