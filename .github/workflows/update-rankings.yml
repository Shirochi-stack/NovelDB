name: Update Novelpia Rankings

on:
  schedule:
    # Run every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: novelpia-data
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update rankings (no auth required)
        run: python scripts/update_rankings_noauth.py

      - name: Re-chunk Novelpia data (with embedded translations + descriptions)
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt --descriptions docs/data/descriptions.txt

      - name: Rebuild instant-load top rankings
        run: python scripts/build_novelpia_top.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/novels.json docs/data/descriptions.txt docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json docs/data/novelpia_top.json.gz
          git commit -m "📊 Update Npia rankings ($(date -u +%Y-%m-%d))"
          git push
