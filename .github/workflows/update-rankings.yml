name: Update Novelpia Rankings

on:
  schedule:
    # Run every 2 days at 00:00 UTC to avoid hammering Novelpia.
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update rankings (no auth required)
        run: python scripts/update_rankings_noauth.py

      - name: Gzip Novelpia descriptions
        run: python scripts/gzip_text_files.py docs/data/descriptions.txt

      - name: Chunk Novelpia descriptions
        run: python scripts/chunk_descriptions.py docs/data/descriptions.txt --prefix descriptions_chunk --output-dir docs/data -n 3

      - name: Re-chunk Novelpia data (with embedded translations)
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt

      - name: Rebuild instant-load top rankings
        run: python scripts/build_novelpia_top.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/novels.json docs/data/descriptions.txt docs/data/descriptions.txt.gz docs/data/descriptions_chunk_*.txt.gz docs/data/descriptions_chunk_manifest.json docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json docs/data/novelpia_top.json.gz
          git commit -m "📊 Update Npia rankings ($(date -u +%Y-%m-%d))"
          git push
