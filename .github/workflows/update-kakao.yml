name: Update Kakao Data

on:
  schedule:
    # Run every Sunday at 09:00 UTC
    - cron: '0 9 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  update-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Migrate legacy descriptions to gzip
        run: python scripts/kakao_descriptions.py

      - name: Install dependencies
        run: pip install requests

      - name: Run Kakao scraper
        run: python scripts/scrape_kakao.py --delay 0.5 --catalog-workers 4 --description-workers 4 --retries 8

      - name: Guard against accidental Kakao catalog shrink
        run: python scripts/guard_catalog_drop.py docs/data/kakao_novels.json --max-drop-ratio 0.20

      - name: Reconcile Kakao descriptions
        run: python scripts/extract_kakao_descriptions.py

      - name: Sync Kakao titles from novels JSON
        run: python scripts/extract_titles.py kakao

      - name: Extract untranslated Kakao titles
        run: python scripts/extract_untranslated_kakao_titles.py

      - name: Extract untranslated Kakao descriptions
        run: python scripts/extract_untranslated_kakao_descriptions.py

      - name: Chunk Kakao descriptions
        run: python scripts/chunk_descriptions.py docs/data/kakao_descriptions.txt.gz --prefix kakao_descriptions_shard --output-dir docs/data -n 128

      - name: Re-chunk Kakao data with embedded translations
        run: python scripts/chunk_and_compress.py --input docs/data/kakao_novels.json --prefix kakao_chunk --output-dir docs/data -n 3 --translations docs/data/kakao_titles_en.txt

      - name: Snapshot recovery inputs
        if: always()
        run: python scripts/metadata_recovery.py snapshot --source kakao

      - name: Back up before publication
        id: backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-kakao-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'docs/data/kakao_*'
          python scripts/publish_metadata.py --message "Update kakao data"
      - name: Report durability
        if: always()
        run: |
          echo "Recovery backup: ${{ steps.backup.outcome }}; publication: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
