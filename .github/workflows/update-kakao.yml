name: Update Kakao Data

on:
  schedule:
    # Run every Sunday at 09:00 UTC
    - cron: '0 9 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  update-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Kakao scraper
        run: python scripts/scrape_kakao.py --delay 0.5 --catalog-workers 4 --description-workers 4 --retries 8

      - name: Guard against accidental Kakao catalog shrink
        run: python scripts/guard_catalog_drop.py docs/data/kakao_novels.json --max-drop-ratio 0.20

      - name: Reconcile Kakao descriptions
        run: python scripts/extract_kakao_descriptions.py

      - name: Sync Kakao titles from novels JSON
        run: python scripts/extract_titles.py kakao

      - name: Extract untranslated Kakao titles
        run: python scripts/extract_untranslated_kakao_titles.py

      - name: Extract untranslated Kakao descriptions
        run: python scripts/extract_untranslated_kakao_descriptions.py

      - name: Gzip Kakao descriptions
        run: python scripts/gzip_text_files.py docs/data/kakao_descriptions.txt

      - name: Chunk Kakao descriptions
        run: python scripts/chunk_descriptions.py docs/data/kakao_descriptions.txt --prefix kakao_descriptions_chunk --output-dir docs/data -n 5

      - name: Re-chunk Kakao data with embedded translations
        run: python scripts/chunk_and_compress.py --input docs/data/kakao_novels.json --prefix kakao_chunk --output-dir docs/data -n 3 --translations docs/data/kakao_titles_en.txt

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          KAKAO_COUNT=$(python -c "import json; print(len(json.load(open('docs/data/kakao_novels.json'))))")
          git add docs/data/kakao_novels.json docs/data/kakao_descriptions.txt docs/data/kakao_descriptions.txt.gz docs/data/kakao_descriptions_chunk_*.txt.gz docs/data/kakao_descriptions_chunk_manifest.json docs/data/kakao_descriptions_untranslated.txt docs/data/kakao_titles_en.txt docs/data/kakao_titles_untranslated.txt docs/data/kakao_chunk_*.json.gz docs/data/kakao_chunk_manifest.json
          git commit -m "Update Kakao data: ${KAKAO_COUNT} novels ($(date -u +%Y-%m-%d))"
          git push
