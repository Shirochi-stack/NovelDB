name: Translate Novelpia Tags

on:
  workflow_run:
    workflows: ["Translate Novelpia Titles & Descriptions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'grok-4-1-fast-reasoning'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (DeepSeek: https://api.deepseek.com)'
        required: false
        default: 'https://api.x.ai/v1'
        type: string
      api_key_secret:
        description: 'GitHub secret name containing the API key'
        required: false
        default: 'GROK_API_KEY'
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      max_input_tokens:
        description: 'Optional chunk input-token budget'
        required: false
        default: ''
        type: string
      max_output_tokens:
        description: 'Optional chunk output-token budget'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: novelpia-data
  cancel-in-progress: false

jobs:
  translate-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      - name: Extract untranslated tags
        run: python scripts/extract_untranslated_tags.py

      - name: Translate tags
        env:
          TRANSLATION_API_KEY: ${{ secrets[github.event.inputs.api_key_secret || 'GROK_API_KEY'] }}
          TRANSLATION_MAX_INPUT_TOKENS: ${{ github.event.inputs.max_input_tokens || '' }}
          TRANSLATION_MAX_OUTPUT_TOKENS: ${{ github.event.inputs.max_output_tokens || '' }}
        run: python scripts/translate_with_grok.py docs/data/tags_untranslated.txt --lang korean --type tags --model ${{ github.event.inputs.model || 'grok-4-1-fast-reasoning' }} --api-base-url ${{ github.event.inputs.api_base_url || 'https://api.x.ai/v1' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated tags into app.js
        run: python scripts/merge_translated_tags.py

      - name: Re-chunk Novelpia data
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt --descriptions docs/data/descriptions.txt

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app.js docs/data/tags_en.txt docs/data/novelpia_chunk_*.json.gz docs/data/novelpia_chunk_manifest.json
          git commit -m "🏷️ Translate Npia tags ($(date -u +%Y-%m-%d))"
          git push
