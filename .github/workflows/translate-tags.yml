name: Translate Korean Catalog Tags

on:
  workflow_run:
    workflows: ["Translate Novelpia Titles & Descriptions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model to use'
        required: false
        default: 'gpt-6-luna'
        type: string
      api_base_url:
        description: 'OpenAI-compatible base URL (blank = auto route)'
        required: false
        default: ''
        type: string
      api_key:
        description: 'API key (blank = OPENAI_API_KEY secret; provider overrides supported)'
        required: false
        default: ''
        type: string
      workers:
        description: 'Parallel translation workers'
        required: false
        default: '67'
        type: string
      delay:
        description: 'Seconds to stagger translation chunks'
        required: false
        default: '5'
        type: string
      output_token_limit:
        description: 'Max output tokens per request (positive integer; blank = repository variable or 16384)'
        required: false
        default: '16384'
        type: string
      compression_factor:
        description: 'Compression factor'
        required: false
        default: '2.0'
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: data-write-lock
  cancel-in-progress: false

jobs:
  translate-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tiktoken

      - name: Mask pasted API key
        if: ${{ github.event.inputs.api_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.api_key }}"

      - name: Extract untranslated tags
        run: python scripts/extract_untranslated_tags.py

      - name: Translate tags
        env:
          TRANSLATION_API_KEY: ${{ github.event.inputs.api_key || '' }}
          TRANSLATION_API_KEY_NAME: ${{ github.event.inputs.api_key && 'TRANSLATION_API_KEY' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TRANSLATION_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
          TRANSLATION_OUTPUT_TOKEN_LIMIT: ${{ github.event.inputs.output_token_limit || vars.TRANSLATION_OUTPUT_TOKEN_LIMIT || '16384' }}
          TRANSLATION_COMPRESSION_FACTOR: ${{ github.event.inputs.compression_factor || '2.0' }}
        run: python scripts/translate_with_grok.py docs/data/tags_untranslated.txt --lang korean --type tags --model ${{ github.event.inputs.model || 'gpt-6-luna' }} --workers ${{ github.event.inputs.workers || '67' }} --delay ${{ github.event.inputs.delay || '5' }}

      - name: Merge translated tags
        run: python scripts/merge_translated_tags.py

      - name: Re-chunk Novelpia data
        run: python scripts/chunk_and_compress.py --input docs/data/novels.json --prefix novelpia_chunk --output-dir docs/data -n 5 --translations docs/data/titles_en.txt

      - name: Snapshot recovery inputs
        if: always()
        run: python scripts/metadata_recovery.py snapshot --source tags

      - name: Back up before publication
        id: backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-tags-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'docs/data/tags*' 'docs/data/novelpia_chunk*'
          python scripts/publish_metadata.py --message "Translate Korean catalog tags"
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report durability
        if: always()
        run: |
          echo "Recovery backup: ${{ steps.backup.outcome }}; publication: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
