name: NpiaMobile
options:
  bundleIdPrefix: com.shirochi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NpiaKit:
    path: NpiaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NpiaMobile:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NpiaKit
        product: NpiaCore
      - package: NpiaKit
        product: NpiaSources
      - package: NpiaKit
        product: NpiaPipeline
      - package: NpiaKit
        product: NpiaUpload
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Npia Mobile
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.shirochi.npiamobile.download.*
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirochi.npiamobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
