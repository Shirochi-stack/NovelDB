name: NpiaMobile
options:
  bundleIdPrefix: com.shirochi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NpiaKit:
    path: NpiaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Release builds are stamped by CI (ios/ci/release_stamp.sh, called by the iOS App workflow):
    # the build number, the release tag and the label. All empty means a development build, which
    # never offers app updates. With a build number, CI also sets CURRENT_PROJECT_VERSION to
    # build / 60 and MARKETING_VERSION to the tag's number.
    NOVELDB_BUILD: ""
    NOVELDB_TAG: ""
    NOVELDB_LABEL: ""
targets:
  NpiaMobile:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NpiaKit
        product: NpiaCore
      - package: NpiaKit
        product: NpiaSources
      - package: NpiaKit
        product: NpiaPipeline
      - package: NpiaKit
        product: NpiaUpload
      - package: NpiaKit
        product: NpiaWebEngine
      - package: NpiaKit
        product: NpiaNet
      - package: NpiaKit
        product: NpiaUpdate
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NovelDB
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Google OAuth iOS client id for Drive uploads; see docs/upload.md.
        NpiaGoogleDriveClientID: ""
        # The stamped build (empty for a development build); read by AppBuildInfo.
        NovelDBBuild: "$(NOVELDB_BUILD)"
        NovelDBTag: "$(NOVELDB_TAG)"
        NovelDBLabel: "$(NOVELDB_LABEL)"
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.shirochi.npiamobile.download.*
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirochi.npiamobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
